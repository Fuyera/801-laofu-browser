name: Review workbench
on:
  push:
    branches: [review/remediation-workbench-20260917]
permissions:
  contents: write
jobs:
  remediation:
    if: contains(github.event.head_commit.message, 'validate remediation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve validation inputs outside feature trees
        run: cp -R review /tmp/laofu-remediation
      - name: Apply, test and publish only four new review branches
        run: python /tmp/laofu-remediation/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-validation
          path: /tmp/laofu-remediation/results
          retention-days: 7
